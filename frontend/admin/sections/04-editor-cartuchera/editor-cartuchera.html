<!-- ============================================================
     ÓNIX FM — Sección 04 — Editor de Cartuchera
     Asigna audios a los botones de disparo del Studio.
     API: GET/PUT/DELETE /api/v1/cartuchera, /api/v1/audios, comando cue
     ============================================================ -->
<link rel="stylesheet" href="css/secciones-operacion.css">

<div class="ox-root" id="cartRoot">
  <header class="ox-head">
    <div>
      <h2>Editor de Cartuchera</h2>
      <p>Cada paleta tiene nombre y botones propios. «Editar» abre el botón como en Soho: eliges el archivo del efecto, lo escuchas y ajustas color, marcas y volumen. En el Studio se hace igual con clic derecho sobre el botón.</p>
    </div>
    <span class="ox-spacer"></span>
    <button class="ox-btn" id="cartReload">↻ Recargar</button>
    <button class="ox-btn ox-btn--primary" id="cartNueva" title="Crea una paleta nueva (p. ej. «Tips genérico», «Efectos fiesta»)">＋ Nueva paleta</button>
  </header>

  <section class="ox-card">
    <h3>Asignar un audio de la biblioteca a un botón</h3>
    <div class="ox-row">
      <div class="ox-field">
        <label for="cartBanco">Paleta</label>
        <select class="ox-select" id="cartBanco"></select>
      </div>
      <div class="ox-field">
        <label for="cartSlot">Botón</label>
        <select class="ox-select" id="cartSlot"></select>
      </div>
      <div class="ox-field" style="flex:3 1 260px">
        <label for="cartBuscar">Audio (escribe para buscar)</label>
        <input class="ox-input" id="cartBuscar" placeholder="Título o artista…" autocomplete="off">
      </div>
      <div class="ox-field">
        <label for="cartEtiqueta">Etiqueta del botón</label>
        <input class="ox-input" id="cartEtiqueta" maxlength="40" placeholder="(opcional)">
      </div>
      <button class="ox-btn" id="cartPreescuchar" title="Suena por la salida de preescucha, no al aire">▶ Escuchar</button>
      <button class="ox-btn" id="cartParar" title="Detener la escucha">■ Detener</button>
      <button class="ox-btn ox-btn--primary" id="cartGuardar">Asignar</button>
    </div>
    <p class="ox-msg" id="cartMsg"></p>
  </section>

  <!-- Una tarjeta por página de la cartuchera (se arman desde el servidor) -->
  <div id="cartPaginas"></div>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = s => s ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "—";
  let NOMBRES = {};

  let bancos = {}, slots = {}, elegido = null;     // elegido = audio escogido en el buscador

  function msg(texto, ok = true) {
    const el = $("cartMsg");
    el.textContent = texto;
    el.className = `ox-msg ${ok ? "ok" : "err"}`;
  }

  // Con decenas de miles de audios no se baja la biblioteca: el buscador consulta al servidor.
  // Primero jingles, efectos, sweepers… (lo que suele ir en una cartuchera) y luego la música.
  OnixBuscador.attach($("cartBuscar"), { primero: "Efecto,Sweeper,Tips,Programa,Cuña", onElegir: a => { elegido = a; } });
  function audioElegido() {
    const id = parseInt($("cartBuscar").dataset.audioId);
    return Number.isFinite(id) && elegido?.id === id ? elegido : null;
  }

  async function cargar() {
    try {
      const cart = await fetch("/api/v1/cartuchera").then(r => r.json());
      bancos = cart.bancos || {};
      NOMBRES = cart.nombres || {};
      $("cartPaginas").innerHTML = Object.keys(bancos).map((b, i) => `<section class="ox-card">
        <h3 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${i + 1} · ${esc(NOMBRES[b] || b)}
          <span class="ox-spacer"></span>
          <button class="ox-btn ox-btn--sm" data-ren="${b}">Renombrar</button>
          <button class="ox-btn ox-btn--sm" data-tam="${b}" title="Cambiar la cantidad de botones">${bancos[b]} botones</button>
          <button class="ox-btn ox-btn--sm ox-btn--danger" data-del="${b}">Eliminar</button>
        </h3><div class="ox-cart-grid" id="cartGrid-${b}"></div></section>`).join("");
      slots = cart.slots || {};
      llenarSelects();
      pintar();
    } catch (err) {
      msg(`No se pudo cargar la cartuchera: ${err.message}`, false);
    }
  }

  function llenarSelects() {
    const banco = $("cartBanco").value || Object.keys(bancos)[0];
    $("cartBanco").innerHTML = Object.keys(bancos)
      .map(b => `<option value="${b}" ${b === banco ? "selected" : ""}>${NOMBRES[b] || b}</option>`).join("");
    const slot = $("cartSlot").value;
    $("cartSlot").innerHTML = Array.from({ length: bancos[banco] || 0 }, (_, i) => i + 1)
      .map(n => `<option value="${n}" ${String(n) === slot ? "selected" : ""}>${n}</option>`).join("");
  }

  function pintar() {
    for (const banco of Object.keys(bancos)) {
      const grid = $(`cartGrid-${banco}`);
      if (!grid) continue;
      grid.innerHTML = Array.from({ length: bancos[banco] }, (_, i) => {
        const n = i + 1;
        const s = (slots[banco] || []).find(x => x.slot === n);
        return `<div class="ox-slot ${s ? "assigned" : ""}" ${s && s.color ? `style="border-left:6px solid ${esc(s.color)}"` : ""}>
          <span class="ox-slot__num">${String(n).padStart(2, "0")}</span>
          <span class="ox-slot__title">${s ? esc(s.etiqueta || s.titulo) : "<i>vacío</i>"}</span>
          <span class="ox-slot__meta">${s ? `${esc(s.titulo)} · ${esc(s.tipo_audio)} · ${fmt(s.duracion)}` : "&nbsp;"}</span>
          <div class="ox-slot__actions">
            <button class="ox-btn ox-btn--sm" data-editar="${banco}:${n}">Editar</button>
            ${s ? `<button class="ox-btn ox-btn--sm" data-cue="${s.audio_id}" data-desde="${s.mark_in || 0}" title="Escuchar (salida de preescucha, no sale al aire)">▶</button>
                   <button class="ox-btn ox-btn--sm" data-parar="1" title="Detener la escucha">■</button>
                   <button class="ox-btn ox-btn--sm ox-btn--danger" data-vaciar="${banco}:${n}">Vaciar</button>` : ""}
          </div>
        </div>`;
      }).join("");
    }
  }

  function cue(id, desde = 0) {
    window.ShellWS?.send({ cmd: "cue", audio_id: id, desde });
    msg("▶ Sonando por la salida de preescucha (no sale al aire). ■ lo detiene.");
  }
  function parar() {
    window.ShellWS?.send({ cmd: "cue_stop" });
    msg("■ Escucha detenida");
  }

  async function paleta(metodo, clave, cuerpo) {
    const res = await fetch(`/api/v1/paletas${clave ? "/" + clave : ""}`, {
      method: metodo, headers: { "Content-Type": "application/json" },
      body: cuerpo ? JSON.stringify(cuerpo) : undefined,
    });
    if (!res.ok) { msg((await res.json().catch(() => ({}))).detail || "No se pudo guardar la paleta", false); return; }
    msg("✓ Paleta guardada");
    cargar();
  }
  $("cartNueva").addEventListener("click", () => {
    const nombre = prompt("Nombre de la nueva paleta (p. ej. «Tips genérico», «Efectos fiesta»):");
    if (nombre?.trim()) paleta("POST", "", { nombre: nombre.trim() });
  });
  $("cartBanco").addEventListener("change", () => { $("cartSlot").value = ""; llenarSelects(); });
  $("cartReload").addEventListener("click", cargar);
  $("cartParar").addEventListener("click", parar);
  $("cartPreescuchar").addEventListener("click", () => {
    const a = audioElegido();
    a ? cue(a.id) : msg("Elige un audio de la lista", false);
  });

  $("cartGuardar").addEventListener("click", async () => {
    const a = audioElegido();
    if (!a) { msg("Elige un audio de la lista (escribe y selecciona una sugerencia)", false); return; }
    const banco = $("cartBanco").value, slot = $("cartSlot").value;
    const res = await fetch(`/api/v1/cartuchera/${banco}/${slot}`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ audio_id: a.id, etiqueta: $("cartEtiqueta").value.trim() }),
    });
    if (!res.ok) { msg("No se pudo asignar", false); return; }
    msg(`✓ ${a.titulo} asignado a ${NOMBRES[banco]} ${slot}`);
    $("cartBuscar").value = ""; $("cartBuscar").dataset.audioId = ""; elegido = null; $("cartEtiqueta").value = "";
    cargar();
  });

  document.getElementById("cartRoot").addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.cue) cue(parseInt(b.dataset.cue), parseFloat(b.dataset.desde) || 0);
    if (b.dataset.parar) parar();
    if (b.dataset.ren) {
      const nombre = prompt("Nombre de la paleta:", NOMBRES[b.dataset.ren] || "");
      if (nombre?.trim()) await paleta("PUT", b.dataset.ren, { nombre: nombre.trim() });
    }
    if (b.dataset.tam) {
      const n = parseInt(prompt("¿Cuántos botones? (3 a 60)", bancos[b.dataset.tam]));
      if (n >= 3 && n <= 60) {
        const quedan = (slots[b.dataset.tam] || []).filter(s => s.slot > n).length;
        if (!quedan || confirm(`Se quitarán ${quedan} botón(es) asignados que quedan fuera.`)) await paleta("PUT", b.dataset.tam, { slots: n });
      }
    }
    if (b.dataset.del && confirm(`¿Eliminar la paleta «${NOMBRES[b.dataset.del]}» y sus botones?`)) await paleta("DELETE", b.dataset.del);
    if (b.dataset.editar) {
      // La ventana «Editar» de Soho: cargar el archivo, escucharlo, color, marcas y volumen
      const [banco, n] = b.dataset.editar.split(":");
      CartEditor.abrir({
        banco, slot: parseInt(n), boton: (slots[banco] || []).find(x => x.slot === parseInt(n)) || null,
        usados: Object.values(slots).flat().map(x => x.color), alGuardar: cargar,
      });
    }
    if (b.dataset.vaciar) {
      const [banco, n] = b.dataset.vaciar.split(":");
      await fetch(`/api/v1/cartuchera/${banco}/${n}`, { method: "DELETE" });
      msg(`Botón ${n} vaciado`);
      cargar();
    }
  });

  document.addEventListener("ws:cartuchera_updated", cargar);
  document.addEventListener("ws:library_updated", cargar);
  cargar();
})();
</script>
